name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. 26.2-verified)"
        required: true
        type: string
  push:
    tags:
      - "*-verified"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Cache loom cache and Minecraft assets
        uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraftforge
          key: ${{ runner.os }}-loom-${{ hashFiles('gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-loom-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: |
          for i in 1 2 3; do
            ./gradlew build --no-daemon && break
            echo "Build attempt $i failed, retrying..."
            sleep 10
          done

      - name: Collect built jars
        id: collect
        run: |
          mkdir -p release-artifacts
          for dir in fabric forge neo; do
            cp platform/$dir/build/libs/*.jar release-artifacts/ 2>/dev/null || true
          done
          ls -la release-artifacts

      - name: Extract changelog for this release
        id: changelog
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG_MSG="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"
          if [ -n "$TAG_MSG" ]; then
            echo "$TAG_MSG" > release-notes.md
          elif echo "$TAG" | grep -qi "snapshot"; then
            [ -f PORT_NOTES.md ] && cp PORT_NOTES.md release-notes.md
          else
            python3 << 'EOF' > release-notes.md
import sys
lines = open('CHANGELOG.txt').readlines()
for i, line in enumerate(lines):
    if line.startswith('===') or line.startswith('---'):
        for j in range(i+1, len(lines)):
            if lines[j].startswith('===') or lines[j].startswith('---'):
                sys.stdout.write(''.join(lines[i+1:j]))
                sys.exit(0)
        sys.stdout.write(''.join(lines[i+1:]))
        sys.exit(0)
EOF
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body_path: release-notes.md
          files: release-artifacts/*.jar
