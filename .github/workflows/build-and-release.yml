name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. 26.2-verified)"
        required: true
        type: string
  push:
    tags:
      - "*-verified"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Cache loom cache and Minecraft assets
        uses: actions/cache@v4
        with:
          path: |
            .gradle/loom-cache
            ~/.gradle/caches/fabric-loom
            ~/.gradle/caches/minecraftforge
          key: ${{ runner.os }}-loom-${{ hashFiles('gradle.properties', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-loom-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: |
          for i in 1 2 3; do
            ./gradlew build --no-daemon && break
            echo "Build attempt $i failed, retrying..."
            sleep 10
          done

      - name: Collect built jars
        id: collect
        run: |
          mkdir -p release-artifacts
          for dir in fabric forge neo; do
            cp platform/$dir/build/libs/*.jar release-artifacts/ 2>/dev/null || true
          done
          ls -la release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: release-artifacts/*.jar
